name: hackathon

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hackathon-aibuddy:latest
    container_name: Hackathon_api
    # --root-path=/api：让 FastAPI 知道自己挂在前端 /api 代理后，docs 页才能正确加载 openapi.json
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 9999 --root-path=/api"
    ports:
      - "9998:9999"
    env_file: .env
    environment:
      # 容器内 localhost 不可达，覆盖为 compose 网络内的服务名
      DATABASE_URL: postgresql://monadmate:monadmate@db:5432/monadmate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: Hackathon_db
    environment:
      POSTGRES_DB: monadmate
      POSTGRES_USER: monadmate
      POSTGRES_PASSWORD: monadmate
    volumes:
      - Hackathon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monadmate -d monadmate"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: Hackathon_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    image: hackathon-aibuddy:latest
    container_name: Hackathon_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://monadmate:monadmate@db:5432/monadmate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: hackathon-aibuddy:latest
    container_name: Hackathon_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://monadmate:monadmate@db:5432/monadmate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  landing:
    build:
      context: ../landing
      dockerfile: Dockerfile
    image: hackathon-landing:latest
    container_name: Hackathon_landing
    ports:
      - "9999:3000"
    restart: unless-stopped

networks:
  default:
    name: Hackathon_network

volumes:
  Hackathon_postgres_data:
